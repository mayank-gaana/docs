openapi: 3.0.3
info:
  title: Gaana AI Visual On-Brand Generation
  version: v1
  description: This API helps external developers to use Gaana AI API to create visuals (image, video) which resonate with their brand guidelines. They can create visuals by giving a concept, providing product images, or using reference images that inspire them.
  contact:
    name: Gaana AI Support
    email: support@gaana.ai
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- description: Production
  url: https://production.getgaana.com/api
- description: Stage/Sandbox
  url: https://experiment.getgaana.com/api
paths:
  /concepts/:
    get:
      operationId: concepts_list
      description: Retrieves a paginated list of all available creative concepts.
        Concepts are the core ideas or themes used to generate visuals.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - concept
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPaginatedListSuccess_B2BContentPillarsList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: concepts_create
      description: Creates a new creative concept. You can define a concept by providing
        a name, a description, and reference images.
      tags:
      - concept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BContentPillars'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /concepts/{id}/:
    get:
      operationId: concepts_retrieve
      description: Retrieves a specific creative concept by its unique identifier.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - concept
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BContentPillars'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: concepts_update
      description: Updates an existing creative concept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - concept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConceptWriteDoc'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BContentPillars'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: concepts_destroy
      description: Deletes a creative concept.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - concept
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_'
          description: ''
  /get_auth_token:
    post:
      operationId: get_auth_token_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AuthTokenRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_AuthTokenData'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      description: Authenticates the user with an API key and returns a JWT bearer
        token for accessing protected endpoints.
  /media-config/:
    get:
      operationId: media_config_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - media-config
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginatedListSuccess_B2BGeneratePostConfig'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      description: Retrieves a list of all media configurations.
    post:
      operationId: media_config_create
      tags:
      - media-config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaConfigRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MediaConfigRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MediaConfigRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BGeneratePostConfig'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      description: Creates a new media configuration for generating visuals.
  /media-config/{id}/:
    get:
      operationId: media_config_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - media-config
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BGeneratePostConfig'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
      description: Retrieves a specific media configuration by its ID.
    delete:
      operationId: media_config_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - media-config
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_'
          description: ''
      description: Deletes a media configuration.
  /media/{object_id}/:
    get:
      operationId: media_list
      description: Retrieves a list of generated media for a specific object.
      parameters:
      - in: path
        name: object_id
        schema:
          type: string
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginatedListSuccess_B2BGeneratedPost'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /media/{object_id}/{id}/:
    get:
      operationId: media_retrieve
      description: Retrieves a specific generated media asset by its ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: object_id
        schema:
          type: string
        required: true
      tags:
      - media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BGeneratedPost'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /products/:
    get:
      operationId: products_list
      description: Retrieves a list of all products.
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaginatedListSuccess_B2BProducts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: products_create
      description: Creates a new product.
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BProducts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /products/{id}/:
    get:
      operationId: products_retrieve
      description: Retrieves a specific product by its ID.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BProducts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: products_update
      description: Updates a product.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/B2BProductRequestDoc'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BProducts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    patch:
      operationId: products_partial_update
      description: Partially updates a product.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedB2BProductRequestDoc'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedB2BProductRequestDoc'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedB2BProductRequestDoc'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_B2BProducts'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    delete:
      operationId: products_destroy
      description: Deletes a product.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '204':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse_'
          description: ''
  /schema/:
    get:
      operationId: schema_retrieve
      description: Retrieves the OpenAPI 3.0 schema for this API.
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
