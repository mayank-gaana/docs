  /upload-media/:
    post:
      operationId: upload_media_create
      description: Uploads a media file (like a product image) to be used as a reference
        for generating visuals.
      tags:
      - file_upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UploadFileRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AuthTokenData:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_at:
          type: integer
      required:
      - access_token
      - expires_at
      - token_type
    AuthTokenRequest:
      type: object
      properties:
        api_key:
          type: string
      required:
      - api_key
    B2BContentPillars:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
          nullable: true
        description:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        ref_images:
          readOnly: true
      required:
      - created_at
      - description
      - id
      - name
      - ref_images
      - updated_at
    B2BGeneratePostConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number_of_posts:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        items:
          type: array
          items:
            $ref: '#/components/schemas/B2BGeneratePostItem'
          readOnly: true
        content_pillar:
          allOf:
          - $ref: '#/components/schemas/B2BContentPillars'
          readOnly: true
      required:
      - content_pillar
      - id
      - items
    B2BGeneratePostItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        post_type:
          $ref: '#/components/schemas/PostTypeEnum'
        assets: {}
        metadata:
          nullable: true
        variants:
          type: array
          items:
            type: string
        descriptions: {}
      required:
      - id
      - post_type
    B2BGeneratedPost:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        content_pillar:
          allOf:
          - $ref: '#/components/schemas/B2BContentPillars'
          readOnly: true
        status:
          $ref: '#/components/schemas/B2BGeneratedPostStatusEnum'
        error_message:
          type: string
          nullable: true
        generate_config:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        estimated_duration:
          type: string
          readOnly: true
        post_type:
          type: string
          readOnly: true
        assets_used:
          type: string
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        media_info:
          type: string
          readOnly: true
      required:
      - assets_used
      - content_pillar
      - created_at
      - estimated_duration
      - generate_config
      - id
      - media_info
      - post_type
      - updated_at
    B2BGeneratedPostStatusEnum:
      enum:
      - success
      - failed
      - fetching
      type: string
      description: '* `success` - success

        * `failed` - failed

        * `fetching` - fetching'
    B2BProductRequestDoc:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        variant:
          type: string
        media_urls:
          type: array
          items:
            $ref: '#/components/schemas/ProductMediaRequest'
      required:
      - name
      - variant
    B2BProducts:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        media_urls: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        variant:
          $ref: '#/components/schemas/VariantEnum'
      required:
      - created_at
      - id
      - updated_at
    ConceptWriteDoc:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
